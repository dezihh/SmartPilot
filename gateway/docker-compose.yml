name: smartpilot-gateway

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
      target: dev
    ports:
      # 0.0.0.0 = im Netz erreichbar. Admin-UI nur im vertrauenswuerdigen Netz
      # betreiben oder das Mapping auf 127.0.0.1:3000:3000 einschraenken.
      - "3000:3000"
    env_file: .env
    volumes:
      - .:/app
      # Ausgelieferte Pakete (Produktionsdaten) readonly, damit der Vertragstest
      # test/contract-packages-registry.test.ts sie im Container pruefen kann.
      - ../packages:/packages:ro
      - node_modules:/app/node_modules
    environment:
      - PACKAGES_DIR=/packages
    command: npm run dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  node_modules:
