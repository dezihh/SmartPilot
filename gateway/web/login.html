<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartPilot Admin – Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="card">
    <h1>SmartPilot Admin</h1>
    <form id="login-form">
      <label for="token">Access-Token</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN eingeben" required>
      <button id="login-send" type="submit">Anmelden</button>
      <div id="error" class="error"></div>
    </form>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
