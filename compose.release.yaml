# Betrieb mit dem fertigen Image aus GHCR: kein Build, kein Repo-Klon.
#
# Layout neben dieser Datei:
#   .env    Image-Version und Laufzeit-Konfiguration (Vorlage: .env.release.example)
#   data/   SQLite-Datenbank, Backups, installierte MCP-Server (entsteht beim Start)
#
# Erststart: docker compose -f compose.release.yaml up -d
# Update:    SMARTPILOT_VERSION in .env aendern, dann pull und up -d
# Rollback:  alte Version eintragen, pull, up -d
#
# Eine .env fuer beides: Compose liest sie fuer ${SMARTPILOT_VERSION}, env_file
# reicht dieselben Werte an den Container weiter.
services:
  gateway:
    image: ghcr.io/dezihh/smartpilot:${SMARTPILOT_VERSION:-latest}
    restart: unless-stopped
    ports:
      # Nur lokal binden (Default 127.0.0.1); fuer LAN-Zugriff GATEWAY_BIND=0.0.0.0 setzen.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
