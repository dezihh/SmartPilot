# Betrieb mit dem fertigen Image aus GHCR: kein Build, kein Repo-Klon.
#
# Diese Datei gehoert zu genau einer Release-Version (Tag im Image-Namen) und
# liegt im Release als compose.yaml. Layout daneben:
#   .env    Laufzeit-Konfiguration (Vorlage: env.example aus dem Release)
#   data/   SQLite-Datenbank, Backups, installierte MCP-Server (entsteht beim Start)
#
# Erststart: docker compose up -d
# Update:    die compose.yaml des neuen Releases laden, dann pull und up -d
# Anpassungen (anderer Port, anderes Image): compose.override.yaml
services:
  gateway:
    image: ghcr.io/dezihh/smartpilot:0.6.3
    restart: unless-stopped
    ports:
      # 0.0.0.0 = im Netz erreichbar. Admin-UI nur im vertrauenswuerdigen Netz
      # betreiben oder das Mapping auf 127.0.0.1:3000:3000 einschraenken.
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
