services:
  gateway:
    build:
      context: ./gateway
      target: runtime
    restart: unless-stopped
    ports:
      # Nur lokal binden (Default 127.0.0.1); fuer LAN-Zugriff GATEWAY_BIND=0.0.0.0 setzen.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-3000}:3000"
    env_file:
      - ./gateway/.env
    volumes:
      - ./gateway/data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
