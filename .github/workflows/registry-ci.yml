name: Registry CI

# Prueft, dass packages/<lang>/index.json mit den Manifesten synchron ist.
# Der Index wird aus den Manifesten generiert; Drift laesst die CI rot werden.
# Der zweite Job prueft die Manifeste selbst (Schema, Platzhalter, Secrets,
# Sicherheitswirkung) - sonst erreicht ein defektes Paket ungeprueft `main`
# und ist nach 60 s Registry-Cache fuer alle Installationen live.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/build-registry-index.mjs'
      - '.github/workflows/registry-ci.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/build-registry-index.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'

      - name: Registry-Index gegen Manifeste pruefen
        run: node scripts/build-registry-index.mjs --check

  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    env:
      # Explizit, damit der Test die Manifeste des Checkouts prueft und nicht
      # versehentlich uebersprungen wird.
      PACKAGES_DIR: ${{ github.workspace }}/packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Installieren
        run: npm ci

      - name: Paket-Vertrag (Schema, Platzhalter, Secrets, Sicherheitswirkung)
        run: node --import tsx --test test/contract-packages-registry.test.ts
