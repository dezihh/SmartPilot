name: Gateway CI

# Typecheck + Tests fuer das Gateway. Laeuft nur bei Aenderungen unter gateway/.
on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # config.ts erzwingt diese Werte beim Import; die Tests brauchen keine
    # echten Dienste (fetch/DB werden isoliert).
    env:
      ADMIN_TOKEN: ci-token
      API_TOKEN: ci-query-token
      LLM_BASE_URL: http://127.0.0.1:9
      LLM_API_KEY: ci-key
      LLM_MODEL: ci-model
    defaults:
      run:
        working-directory: gateway
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Installieren
        run: npm ci

      - name: Typecheck (src)
        run: npm run typecheck

      - name: Typecheck (Tests)
        run: npm run typecheck:tests

      # Billige Gates zuerst: sie brechen schneller ab als die Testsuite.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Toter Code (knip)
        run: npm run deadcode

      - name: Importzyklen (madge)
        run: npm run cycles

      - name: Duplikate (jscpd, max. 3 %)
        run: npm run dupes

      - name: Build
        run: npm run build

      - name: Docker-Image (runtime)
        run: docker build --target runtime -t smartpilot-gateway:ci .

      - name: Tests + Coverage-Gate
        run: npm run coverage

      # Blockierendes Gate: critical.
      - name: Audit (blockierend, critical)
        run: npm audit --omit=dev --audit-level=critical

      # High-Findings sichtbar machen, ohne die Pipeline dauerhaft rot zu halten
      # (bekannt: undici 6.x, Fix ueber Dependabot-PR #16).
      - name: Audit-Report (high, nicht blockierend)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
