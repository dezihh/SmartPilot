name: Lambda CI

# Tests fuer die Alexa-Lambda. Laeuft nur bei Aenderungen unter alexa/.
# Der Test (alexa/lambda/test_lambda_function.py) stubbt ask-sdk und requests
# per sys.modules - es wird bewusst nichts installiert.
on:
  push:
    branches: [main]
    paths:
      - 'alexa/lambda/**'
      - '.github/workflows/lambda-ci.yml'
  pull_request:
    paths:
      - 'alexa/lambda/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa/lambda
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Tests mit Coverage
        run: |
          python -m pip install --quiet coverage==7.17.2
          coverage run test_lambda_function.py
          coverage report --include=lambda_function.py --fail-under=80
