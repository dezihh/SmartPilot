name: Lambda CI

# Tests fuer die Alexa-Lambda und die Skill-Config. Laeuft nur bei
# Aenderungen unter alexa/. Der Lambda-Test
# (alexa/lambda/test_lambda_function.py) stubbt ask-sdk und requests
# per sys.modules - es wird bewusst nichts installiert.
on:
  push:
    branches: [main]
    paths:
      - 'alexa/lambda/**'
      - 'alexa/scripts/**'
      - '.github/workflows/lambda-ci.yml'
  pull_request:
    paths:
      - 'alexa/lambda/**'
      - 'alexa/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: alexa/lambda
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Tests mit Coverage
        run: |
          python -m pip install --quiet coverage==7.17.2
          coverage run test_lambda_function.py
          coverage report --include=lambda_function.py --fail-under=80

      - name: Skill-Config testen
        working-directory: .
        run: python3 alexa/scripts/test_skill_config.py
